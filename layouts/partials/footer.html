<footer class="site-footer">
  <div class="taskbar-inner">
    <details class="start-menu">
      <summary><span class="start-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Start</summary>
      <nav class="start-panel" aria-label="시작 메뉴">
        <div class="start-banner">DevLog <strong>98</strong></div>
        <div class="start-links">{{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
        {{ with site.Params.github }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>{{ end }}</div>
      </nav>
    </details>
    <a class="task-button" href="{{ .RelPermalink }}"><span class="pixel-icon document" aria-hidden="true"></span><span>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}</span></a>
    <span class="taskbar-credit">© {{ now.Year }} {{ site.Params.author }}</span>
    <div class="system-tray"><span aria-hidden="true">▣</span><time id="desktop-clock" aria-label="현재 시각">--:--</time></div>
  </div>
</footer>
